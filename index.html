.greet h3{font-size:2.6rem;margin-bottom:4px}
.greet p{color:var(--ink-soft);margin:0 0 22px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.choice input,.chips input{position:absolute;opacity:0;pointer-events:none;width:1px}
.choice label{display:block;text-align:center;padding:20px 10px;border-radius:18px;cursor:pointer;background:#F7F5F1;border:3px solid transparent;transition:transform .15s}
.choice label:hover{transform:translateY(-2px)}
.choice label b{display:block;font-size:1.7rem;font-weight:800;letter-spacing:-.03em}
.choice label span{font-size:.92rem;color:var(--ink-soft)}
.choice input:checked + label.si{background:var(--yellow);border-color:var(--green)}
.choice input:checked + label.no{background:#EDEAE4;border-color:var(--ink-soft)}
.choice input:focus-visible + label,.chips input:focus-visible + label{outline:3px solid var(--pink);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{padding:10px 16px;border-radius:999px;background:#F7F5F1;cursor:pointer;font-weight:500;font-size:.98rem;border:2px solid transparent}
.chips input:checked + label{background:var(--green);color:var(--yellow);border-color:var(--green)}
.santo{display:flex;gap:12px;align-items:flex-start;background:#FFF3C9;border-radius:14px;padding:14px 16px;margin:14px 0 0;font-size:.98rem;line-height:1.45;color:var(--green)}
.santo svg{flex:0 0 22px;margin-top:2px}
.details[hidden]{display:none}
.check{display:flex;gap:12px;align-items:flex-start;background:#F7F5F1;border-radius:14px;padding:14px 16px;cursor:pointer;font-size:1rem;line-height:1.45;border:2px solid transparent}
.check:has(input:checked){border-color:var(--green);background:#EEF4EA}
.check input{width:22px;height:22px;flex:0 0 22px;margin:1px 0 0;accent-color:var(--green)}
.small{font-size:.92rem;color:var(--ink-soft)}
.msg{padding:12px 14px;border-radius:12px;margin:14px 0 0;font-size:.98rem}
.msg.err{background:#FDE2E6;color:#9B1C3A}
.done{text-align:center}
.done h3{font-size:3rem;margin-bottom:10px}
.done .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}

/* FAQ */
#faq{background:#FDEEF3;color:var(--green)}
.faq{max-width:820px;margin-top:36px}
.faq details{border-top:3px solid var(--green);padding:20px 0}
.faq details:last-child{border-bottom:3px solid var(--green)}
.faq summary{cursor:pointer;list-style:none;font-size:clamp(1.25rem,2.6vw,1.6rem);font-weight:700;letter-spacing:-.02em;display:flex;justify-content:space-between;gap:16px;color:var(--green)}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:1.8rem;line-height:1;color:var(--pink);transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq p{margin:12px 0 0;color:var(--ink-soft);max-width:60ch}
.faq details p+p{margin-top:8px}
.faq .mapbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

/* REGALOS */
#regalos{background:var(--yellow);color:var(--green)}
.gift{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}
@media(max-width:820px){.gift{grid-template-columns:1fr;gap:26px}}
.gift .txt{font-size:1.2rem;max-width:38ch}
.alias{background:var(--green);color:#fff;border-radius:24px;padding:28px;transform:rotate(-1.5deg)}
.alias small{display:block;font-size:.95rem;opacity:.8;margin-bottom:6px}
.alias b{display:block;font-size:clamp(1.5rem,4vw,2.2rem);font-weight:800;letter-spacing:-.02em;word-break:break-all;color:var(--yellow)}
.alias .btn{margin-top:18px}
.fresca{margin-top:22px;font-size:1.25rem;font-weight:700}

footer{background:var(--yellow);color:var(--green);padding:64px 0 48px}
footer .big{font-size:clamp(3rem,12vw,8rem);font-weight:800;letter-spacing:-.06em;line-height:.85;color:var(--pink)}
footer .big em{font-style:normal;color:var(--green)}
footer .row{display:flex;flex-direction:column;gap:12px;margin-top:30px;align-items:flex-start}
footer .row>span{font-weight:800;font-size:1.2rem}
footer .wa{display:flex;gap:10px;flex-wrap:wrap}

/* LIGHTBOX */
.lb{position:fixed;inset:0;z-index:60;background:rgba(10,30,22,.95);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.lb.open{opacity:1;pointer-events:auto}
.lb img{max-width:92vw;max-height:86vh;border-radius:10px}
.lb button{position:absolute;background:rgba(255,255,255,.12);border:0;color:#fff;width:50px;height:50px;border-radius:50%;font-size:1.7rem;cursor:pointer}
.lb .x{top:16px;right:16px}.lb .pv{left:12px;top:50%;transform:translateY(-50%)}.lb .nx{right:12px;top:50%;transform:translateY(-50%)}
.lb .ct{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:rgba(255,255,255,.7);font-size:.9rem}

@media (prefers-reduced-motion:reduce){
  .stamp svg,.ticker .track{animation:none}
  .film .frame.on img{animation:none}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<nav aria-label="Secciones">
  <a href="#dia">¿Cuál es el plan?</a>
  <a href="#faq">Detalles generales</a>
  <a href="#rsvp" class="cta">Confirmar asistencia</a>
</nav>

<header class="hero" id="inicio">
  <div class="mosaic" id="mosaic" aria-hidden="true"></div>
  <div class="cartel" role="img" aria-label="26 de marzo de 2027, 17 horas, La Herencia, Pilar">
      <svg class="hilos" viewBox="0 0 300 200" preserveAspectRatio="none" aria-hidden="true"><path d="M150 0 L40 200 M150 0 L260 200" stroke="currentColor" stroke-width="3" fill="none"/></svg>
      <span class="clavo" aria-hidden="true"></span>
      <div class="tabla"><b>26.03.2027</b><span>17 hs | La Herencia, Pilar</span></div>
    </div>
  <div class="wrap">
    <div class="holaInv" id="holaInv" hidden></div>
    <h1 id="nombres"><span class="l1">¡Nos</span><span class="l2">casamos!</span></h1>
    <p class="sub" id="heroSub">¡Y quisiéramos festejarlo con vos!</p>
  </div>
</header>


<section id="dia">
  <div class="wrap">
    <div class="head"><h2>¿Cuál es el plan?</h2><p id="diaFecha"></p></div>
    <div class="day">
      <ol class="steps" id="steps"></ol>
      <div class="dress"><h3>Dress code</h3><p id="dress"></p></div>
    </div>
  </div>
</section>



<section id="faq">
  <div class="wrap">
    <h2 style="color:var(--green)">Detalles generales</h2>
    <div class="faq" id="faqList"></div>
  </div>
</section>

<section id="rsvp">
  <div class="wrap">
    <div>
      <h2>¿Venís?</h2>
      <p class="lead" id="rsvpLead"></p>
      <div class="cuenta" id="cuentaRsvp"><b id="diasRsvp">—</b><span>días para<br>confirmar</span></div>
    </div>
    <div class="panel" id="panel"></div>
  </div>
</section>


<footer>
  <div class="wrap">
    <div class="big" id="nosVemos">nos vemos<br>el 26</div>
    <div class="row">
      <span>¿Dudas? Escribinos</span>
      <div class="wa" id="footContact"></div>
    </div>
  </div>
</footer>

<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const C = CONFIG;
  const DEMO = !C.apiUrl;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let inv = null;

  /* ---------- Contenido ---------- */
  const F = C.fotos;
  /* ---------- Cuadrícula de fotos de la portada ---------- */
  (() => {
    const box = $("#mosaic"), P = [...(C.portada || [])];
    if (!box || !P.length) return;
    for (let i = P.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [P[i], P[j]] = [P[j], P[i]]; }
    let tiles = [], cols = 0;
    const build = () => {
      const n = matchMedia("(max-width:760px)").matches ? 15 : 15;
      if (tiles.length === n) return;
      box.innerHTML = ""; tiles = [];
      for (let i = 0; i < n; i++) {
        const t = document.createElement("div"); t.className = "t";
        const a = new Image(), b = new Image(); a.alt = b.alt = ""; a.decoding = b.decoding = "async";
        a.src = P[i % P.length]; a.onload = () => a.classList.add("on");
        t.append(a, b); box.appendChild(t); tiles.push({ a, b, cur: a, src: a.src.split("/").pop() });
      }
    };
    build();
    if (P.length <= tiles.length) return;
    let next = tiles.length, last = -1;
    const swap = () => {
      if (document.hidden) return;
      let k; do { k = Math.floor(Math.random() * tiles.length); } while (k === last && tiles.length > 1); last = k;
      const t = tiles[k], showing = new Set(tiles.map(x => x.src));
      let src, guard = 0; do { src = P[next++ % P.length]; } while (showing.has(src.split("/").pop()) && ++guard < P.length);
      const nx = t.cur === t.a ? t.b : t.a;
      nx.onload = () => { nx.classList.add("on"); t.cur.classList.remove("on"); t.cur = nx; t.src = src.split("/").pop(); };
      nx.src = src;
    };
    setInterval(() => { swap(); setTimeout(swap, 350); }, 1100);
  })();
  const tk = `<span>viernes 26 de marzo</span><i>✺</i><span>La Herencia, La Lonja</span><i>✺</i><span>confirmá antes del 30 de noviembre</span><i>✺</i>`;

  if (C.historia.length) { const s = $("#story"); s.hidden = false; s.innerHTML = C.historia.map(p => `<p>${esc(p)}</p>`).join(""); }
  $("#diaFecha").textContent = "Disfrutar con familia y amigos, comer muy pero muy rico y festejar todos juntos.";
  if (!C.dia.length) $("#steps").outerHTML = `<div class="soon"><b>Próximamente</b><span>Muy pronto vas a encontrar acá los horarios de la celebración.</span></div>`;
  else {
    const base = F[0] ? F[0].replace(/[^/]*$/, "") : "fotos/";
    $("#steps").classList.add("hitos");
    const SHH = "data:image/svg+xml," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none' stroke='#000' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><circle cx='46' cy='50' r='34'/><path d='M29 45q6 5 12 0M51 45q6 5 12 0'/><path d='M32 67h8M54 67h8'/><path d='M42 92V60a5 5 0 0 1 10 0v32'/><path d='M80 30l8-8M84 42l10-2M78 20l2-10'/></svg>");
    const icono = i => `<div class="icw" aria-hidden="true"><div class="ico" style="--ic:url(&quot;${i}&quot;)"></div></div>`;
    $("#steps").innerHTML = C.dia.map((i, k) => (k > 0 && C.diaMedio ? `<li class="con-ico medio">${icono(SHH)}<div class="h">Shhh…</div><div><b>${esc(C.diaMedio)}</b></div></li>` : "") +
      `<li class="con-ico">${icono(base + esc(i.icono))}<div class="h">${esc(i.hora)}</div><div><b>${esc(i.que)}</b><span>${esc(i.detalle)}</span></div></li>`).join("");
  }
  $("#dress").textContent = C.dressCode;
  $("#faqList").innerHTML = C.preguntas.map(q => `<details><summary>${esc(q.p)}</summary>${[].concat(q.r).map(t => `<p>${esc(t)}</p>`).join("")}${q.mapas ? `<div class="mapbtns"><a class="btn sm" href="${esc(C.lugar.wazeLink)}" target="_blank" rel="noopener">Ir con Waze</a><a class="btn sm ghost" href="${esc(C.lugar.mapsLink)}" target="_blank" rel="noopener">Abrir en Google Maps</a></div>` : ""}</details>`).join("");
  $("#footContact").innerHTML = C.contactos.map(c => `<a class="btn w sm" href="https://wa.me/${esc(c.whatsapp.replace(/\D/g, ""))}" target="_blank" rel="noopener">WhatsApp ${esc(c.nombre)}</a>`).join("");
  const faltan = iso => Math.max(0, Math.ceil((new Date(iso) - Date.now()) / 864e5));
  const dR = faltan("2026-11-30T23:59:00-03:00");
  if (dR > 0) { $("#diasRsvp").textContent = dR; $("#cuentaRsvp").querySelector("span").innerHTML = dR === 1 ? "día para<br>confirmar" : "días para<br>confirmar"; } else $("#cuentaRsvp").hidden = true;
  const dF = faltan(C.fechaISO);
  if (dF > 1) $("#nosVemos").innerHTML = `nos vemos<br>en <em>${dF}</em> días`; else if (dF === 1) $("#nosVemos").innerHTML = "nos vemos<br><em>mañana</em>"; else $("#nosVemos").innerHTML = "¡hoy es<br>el día!";
  $("#rsvpLead").textContent = `Confirmanos antes del ${C.fechaLimiteRSVP}. Si cambian los planes, podés cambiar tu respuesta cuando quieras.`;
  if (C.video) { const v = $("#video"); v.hidden = false; v.innerHTML = `<iframe src="${esc(C.video)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="Video"></iframe>`; }

  if ($("#film")) {
  /* ---------- Película ---------- */
  const film = $("#film"), bar = film.querySelector(".bar");
  F.forEach((f, i) => { const d = document.createElement("div"); d.className = "frame"; d.innerHTML = `<div class="blur" style="background-image:url('${esc(f)}')"></div><img src="${esc(f)}" alt="" ${i > 1 ? 'loading="lazy"' : ""}>`; film.insertBefore(d, bar); });
  $("#dots").innerHTML = F.map(() => "<i></i>").join("");
  const frames = [...film.querySelectorAll(".frame")], dots = [...$("#dots").children];
  let cur = -1, timer = null, playing = !reduce;
  const go = i => {
    cur = (i + F.length) % F.length;
    frames.forEach((f, k) => f.classList.toggle("on", k === cur));
    dots.forEach((d, k) => { d.className = k < cur ? "done" : k === cur ? "cur" : ""; });
    const nx = frames[(cur + 1) % F.length].querySelector("img"); if (nx.loading === "lazy") nx.loading = "eager";
  };
  const schedule = () => { clearTimeout(timer); if (playing) timer = setTimeout(() => { go(cur + 1); schedule(); }, 5000); };
  const setPlay = p => { playing = p; film.classList.toggle("paused", !p); $("#playBtn").textContent = p ? "❚❚" : "▶"; $("#playBtn").setAttribute("aria-label", p ? "Pausar" : "Reproducir"); schedule(); };
  $("#playBtn").onclick = () => setPlay(!playing);
  go(0); setPlay(playing);
  // pausar si no se ve (ahorra datos)
  new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) clearTimeout(timer); else schedule(); })).observe(film);

  const audio = $("#audio");
  if (C.musica) {
    audio.src = C.musica; const mb = $("#musicBtn"); mb.hidden = false;
    mb.onclick = () => { if (audio.paused) { audio.play(); mb.textContent = "♫ Pausar música"; setPlay(true); } else { audio.pause(); mb.textContent = "♫ Con música"; } };
  }

  /* ---------- Grilla + lightbox ---------- */
  $("#grid").innerHTML = F.map((f, i) => `<button type="button" data-i="${i}" aria-label="Ver foto ${i + 1}"><img src="${esc(f)}" alt="" loading="lazy"></button>`).join("");
  $("#gridBtn").onclick = e => { const g = $("#grid"); g.classList.toggle("open"); e.target.textContent = g.classList.contains("open") ? "Ocultar fotos" : "Ver todas las fotos"; };
  const lb = document.createElement("div"); lb.className = "lb";
  lb.innerHTML = `<img alt=""><button class="x" aria-label="Cerrar">×</button><button class="pv" aria-label="Anterior">‹</button><button class="nx" aria-label="Siguiente">›</button><div class="ct"></div>`;
  document.body.appendChild(lb);
  let li = 0;
  const show = i => { li = (i + F.length) % F.length; lb.querySelector("img").src = F[li]; lb.querySelector(".ct").textContent = `${li + 1} de ${F.length}`; lb.classList.add("open"); };
  const close = () => lb.classList.remove("open");
  $("#grid").addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (b) show(+b.dataset.i); });
  lb.querySelector(".x").onclick = close; lb.querySelector(".pv").onclick = () => show(li - 1); lb.querySelector(".nx").onclick = () => show(li + 1);
  lb.addEventListener("click", e => { if (e.target === lb) close(); });
  document.addEventListener("keydown", e => { if (!lb.classList.contains("open")) return; if (e.key === "Escape") close(); if (e.key === "ArrowLeft") show(li - 1); if (e.key === "ArrowRight") show(li + 1); });
  let sx = null; lb.addEventListener("touchstart", e => sx = e.touches[0].clientX, { passive: true });
  lb.addEventListener("touchend", e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) show(li + (dx < 0 ? 1 : -1)); sx = null; });

  }

  /* ---------- API ---------- */
  const DEMO_DB = { DEMO: { ok: true, codigo: "DEMO", nombre: "Martina Rodríguez", deParte: "Agus", respuesta: null } };
  async function apiGet(code) {
    if (DEMO) { await new Promise(r => setTimeout(r, 250)); return DEMO_DB[code] || { ok: false, error: "No encontramos ese código. En la vista previa, probá con DEMO." }; }
    const r = await fetch(`${C.apiUrl}?action=invite&code=${encodeURIComponent(code)}`);
    return r.json();
  }
  async function apiPost(payload) {
    if (DEMO) { await new Promise(r => setTimeout(r, 500)); DEMO_DB.DEMO.respuesta = payload; return { ok: true }; }
    const r = await fetch(C.apiUrl, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
    return r.json();
  }

  /* ---------- RSVP ---------- */
  const panel = $("#panel");
  const MENUS = ["Sin restricciones", "Vegetariano", "Vegano", "Sin TACC (celíaco)", "Sin lactosa", "Otro"];
  const santoSvg = `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16.5v.5"/></svg>`;

  function renderCode(error) {
    inv = null;
    panel.innerHTML = `
      ${DEMO ? `<p class="small" style="margin:0 0 14px">Vista previa: probá con el código <b>DEMO</b>.</p>` : ""}
      <form id="codeForm">
        <div class="field"><label class="lbl" for="code">Tu código de invitación</label>
          <div class="code-box"><input id="code" autocomplete="off" required maxlength="10" placeholder="K7Q2M"><button class="btn" type="submit">Entrar</button></div></div>
        <p class="small" style="margin:0">Está en el mensaje que te mandamos por WhatsApp. Si entraste con tu link, no hace falta.</p>
        ${error ? `<div class="msg err">${esc(error)}</div>` : ""}
      </form>`;
    $("#codeForm").onsubmit = e => { e.preventDefault(); load($("#code").value.trim().toUpperCase()); };
  }

  async function load(code) {
    panel.innerHTML = `<p style="margin:0">Buscando tu invitación…</p>`;
    try {
      const d = await apiGet(code);
      if (!d.ok) return renderCode(d.error || "No encontramos ese código. Revisá el mensaje que te mandamos.");
      inv = d;
      try { localStorage.setItem("rsvp_code", code); } catch (_) {}
      if (!DEMO) { try { const url = new URL(location.href); url.searchParams.set("c", code); history.replaceState(null, "", url); } catch (_) {} }
      { const h = $("#holaInv"); h.textContent = `¡Hola, ${d.nombre.split(" ")[0]}!`; h.hidden = false; }
      d.respuesta ? renderDone(d.respuesta, true) : renderForm();
    } catch (err) {
      renderCode("No pudimos conectarnos. Revisá tu conexión y probá de nuevo.");
    }
  }

  function renderForm() {
    const p = inv.respuesta || {};
    const first = esc(inv.nombre.split(" ")[0]);
    const menu = p.menu || "Sin restricciones";
    panel.innerHTML = `
      <form id="rsvpForm" novalidate>
        <div class="greet"><h3>¡Hola, ${first}!</h3><p>¿Venís el ${esc(C.fechaTexto.replace(" de 2027", ""))}?</p></div>
        <div class="choice" role="radiogroup" aria-label="¿Venís?">
          <input type="radio" id="si" name="asiste" value="Sí" ${p.asiste === "Sí" ? "checked" : ""}><label class="si" for="si"><b>¡Voy!</b><span>No me lo pierdo</span></label>
          <input type="radio" id="no" name="asiste" value="No" ${p.asiste === "No" ? "checked" : ""}><label class="no" for="no"><b>No puedo</b><span>Brindo desde lejos</span></label>
        </div>
        <div class="details" id="det" ${p.asiste === "Sí" ? "" : "hidden"}>
          <div class="field">
            <span class="lbl" id="menuLbl">¿Qué menú preferís?</span>
            <div class="chips" role="radiogroup" aria-labelledby="menuLbl">
              ${MENUS.map((m, i) => `<input type="radio" name="menu" id="m${i}" value="${m}" ${menu === m ? "checked" : ""}><label for="m${i}">${m}</label>`).join("")}
            </div>
            <div class="santo">${santoSvg}<div><b>Es Viernes Santo.</b> Si por tu fe no comés carne ese día, elegí <b>Vegetariano</b> y listo.</div></div>
          </div>
          <div class="field"><label class="lbl" for="alergias">¿Alguna alergia u otra restricción?</label><input id="alergias" name="alergias" value="${esc(p.alergias || "")}" placeholder="Ej: alergia a los frutos secos"></div>
          <div class="field">
            <span class="lbl">Traslados</span>
            <label class="check"><input type="checkbox" name="traslado" id="traslado" ${p.traslado ? "checked" : ""}><span>Vamos a organizar remises puerta a puerta por zona o combis. <b>¿Querés que te ayudemos a coordinar tu traslado?</b></span></label>
          </div>
          <div class="field"><label class="lbl" for="cancion">Una canción que no puede faltar</label><input id="cancion" name="cancion" value="${esc(p.cancion || "")}" placeholder="La que te hace saltar a la pista"></div>
        </div>
        <div class="field"><label class="lbl" for="mensaje">Un mensaje para nosotros (opcional)</label><textarea id="mensaje" name="mensaje">${esc(p.mensaje || "")}</textarea></div>
        <div id="formMsg"></div>
        <button class="btn" type="submit" id="sendBtn" style="width:100%;justify-content:center;margin-top:6px">Enviar respuesta</button>
        <p class="small" style="text-align:center;margin:16px 0 0">¿No sos ${esc(inv.nombre)}? <a href="#" id="otherCode">Ingresar otro código</a></p>
      </form>`;
    panel.querySelectorAll('input[name=asiste]').forEach(r => r.addEventListener("change", () => { $("#det").hidden = r.value !== "Sí"; }));
    $("#otherCode").onclick = e => { e.preventDefault(); try { localStorage.removeItem("rsvp_code"); } catch (_) {} renderCode(); };
    $("#rsvpForm").onsubmit = submit;
  }

  function renderDone(r, returning) {
    const va = r.asiste === "Sí";
    panel.innerHTML = `<div class="done">
      <h3>${va ? "¡Qué alegría!" : "Te vamos a extrañar"}</h3>
      <p>${returning ? "Ya tenemos tu respuesta. " : ""}${va ? `Te esperamos el ${esc(C.fechaTexto)}.${r.menu && r.menu !== "Sin restricciones" ? ` Anotamos menú <b>${esc(r.menu.toLowerCase())}</b>.` : ""}` : "Gracias por avisarnos. Vamos a brindar por vos."}</p>
      <div class="btns">
        ${va ? `<a class="btn sm" href="${calendarLink()}" target="_blank" rel="noopener">Agendar en Google Calendar</a>` : ""}
        <button class="btn sm ghost" id="editBtn">Cambiar respuesta</button>
      </div></div>`;
    $("#editBtn").onclick = renderForm;
  }

  function calendarLink() {
    const start = new Date(C.fechaISO), end = new Date(start.getTime() + 9 * 36e5);
    const f = d => d.toISOString().replace(/[-:]|\.\d{3}/g, "");
    const q = new URLSearchParams({ action: "TEMPLATE", text: `Casamiento ${C.novia} y ${C.novio}`, dates: `${f(start)}/${f(end)}`, location: `${C.lugar.nombre}, ${C.lugar.direccion}`, details: "https://agusyguido.com.ar" });
    return "https://calendar.google.com/calendar/render?" + q;
  }

  async function submit(e) {
    e.preventDefault();
    const fd = new FormData(e.target), msg = $("#formMsg");
    const asiste = fd.get("asiste");
    if (!asiste) { msg.innerHTML = `<div class="msg err">Elegí si venís o no para poder enviar.</div>`; return; }
    const payload = { action: "rsvp", codigo: inv.codigo, asiste, mensaje: (fd.get("mensaje") || "").trim() };
    if (asiste === "Sí") Object.assign(payload, { menu: fd.get("menu") || "Sin restricciones", alergias: (fd.get("alergias") || "").trim(), cancion: (fd.get("cancion") || "").trim(), traslado: fd.get("traslado") === "on" });
    const btn = $("#sendBtn"); btn.disabled = true; btn.textContent = "Enviando…"; msg.innerHTML = "";
    try {
      const r = await apiPost(payload);
      if (!r.ok) throw new Error(r.error || "error del servidor");
      inv.respuesta = payload;
      renderDone(payload, false);
    } catch (err) {
      msg.innerHTML = `<div class="msg err">No se pudo enviar (${esc(err.message)}). Revisá tu conexión y probá de nuevo.</div>`;
      btn.disabled = false; btn.textContent = "Enviar respuesta";
    }
  }

  let start = null;
  try { start = new URLSearchParams(location.search).get("c"); } catch (_) {}
  if (!start && !DEMO) { try { start = localStorage.getItem("rsvp_code"); } catch (_) {} }
  if (start) load(start.toUpperCase()); else renderCode();
})();
</script>
</body>
</html>
